<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero QA</title>
<style>
:root{--bg:#eef1f4;--col:#e2e7ec;--card:#fff;--tx:#1b2733;--mu:#65758a;--bd:#d3dae2;--ac:#0f766e;--d0:#2563eb;--d1:#e11d48;--d2:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--col:#18222c;--card:#1f2c39;--tx:#e8eef4;--mu:#93a4b8;--bd:#2c3b4b;--ac:#2dd4bf;--d0:#60a5fa;--d1:#fb7185;--d2:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:20px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font:700 28px Georgia,serif}
.sub{color:var(--mu);margin-top:2px}
.bar{height:8px;background:var(--col);border-radius:4px;overflow:hidden;width:220px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
nav{display:flex;flex-wrap:wrap;gap:8px}
button,a.btn{font:inherit;padding:7px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;cursor:pointer;text-decoration:none}
button:hover,a.btn:hover{border-color:var(--ac)}
.p{background:var(--ac);border-color:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){.p{color:#06201d}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:900px){#b{grid-template-columns:1fr 1fr}}@media(max-width:560px){#b{grid-template-columns:1fr}}
.col{background:var(--col);border-radius:10px;padding:10px;min-height:160px}
.col.over{outline:2px dashed var(--ac)}
h3{margin:2px 4px 10px;display:flex;justify-content:space-between;font-size:15px}
h3 span{color:var(--mu);font-weight:400}
.card{background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--c);cursor:grab;box-shadow:0 1px 2px #0002}
.card:active{cursor:grabbing}
.m{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-top:6px}
.empty{color:var(--mu);text-align:center;padding:16px 4px;font-size:13px}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 3px;color:var(--mu);font-size:13px}
textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);resize:vertical}
.nt{color:var(--mu);font-size:13px;margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.ro .ed{display:none}body.ro .card{cursor:default}
.hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.card b a{color:var(--ac);text-decoration:none}.card b a:hover{text-decoration:underline}
.pb{height:5px;background:var(--col);border-radius:3px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
input,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.r{display:flex;gap:8px;margin-top:16px}.r .sp{flex:1}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#b.q{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:700px){#b.q{grid-template-columns:1fr}}
</style></head><body>
<header>
 <div><h1 id="t"></h1><div class="sub" id="r"></div><div class="bar"><i id="pb"></i></div><div class="sub" id="s"></div><div class="sub" id="st">Conectando…</div></div>
 <nav>
  <a class="btn" href="index.html">Tablero desarrollo</a>
  <a class="btn" id="bd" href="burndown.html">Ver burndown</a>
  <button class="ed" onclick="openCfg()">Sprint y equipo QA</button>
  <button class="ed" onclick="closeQA()">Cerrar sprint QA</button>
  <button onclick="askCode()">Código del equipo</button>
  <button id="lg" onclick="authBtn()">Iniciar sesión</button>
 </nav>
</header>
<main id="b" class="q"></main>
<dialog id="dt"><b id="ti"></b>
 <div class="g"><div><label>Horas de pruebas</label><input id="es" type="number" min="0" step="0.5"></div><div><label>Responsable QA</label><select id="dv"></select></div></div>
 <label>% de avance (en Terminado cuenta 100%)</label><input id="pc" type="number" min="0" max="100" step="5">
 <label>Columna</label><select id="cl"></select>
 <label>Notas</label><textarea id="nt" rows="3"></textarea>
 <div class="r"><button class="p" onclick="saveTask()">Guardar</button><button onclick="dt.close()">Cancelar</button><span class="sp"></span><button onclick="back()">Devolver a desarrollo</button></div></dialog>
<dialog id="dc"><label>Nombre del sprint QA</label><input id="cn">
 <div class="g"><div><label>Inicio</label><input id="cs" type="date"></div><div><label>Fin</label><input id="ce" type="date"></div></div>
 <label>Integrantes QA</label><input id="n0"><input id="n1" style="margin-top:6px">
 <label>Días no laborables (AAAA-MM-DD, uno por línea)</label><textarea id="of" rows="3"></textarea>
 <div class="r"><button class="p" onclick="saveCfg()">Guardar</button><button onclick="dc.close()">Cancelar</button></div></dialog>
<dialog id="dl"><label>Correo</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password">
 <div class="r"><button class="p" onclick="doLogin()">Entrar</button><button onclick="dl.close()">Cancelar</button><span class="sp"></span><button onclick="resetPw()">Olvidé mi contraseña</button></div></dialog>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue,update,set} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const COLS=[['todo','Por hacer'],['doing','En progreso'],['done','Terminado']],$=id=>document.getElementById(id),C=window.FB_CONFIG||{};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>s.split('-').reverse().join('/'),r1=v=>Math.round(v*10)/10,fin=c=>c=='done'||c=='approved';
const jl=t=>/^[A-Za-z]+-\d+$/.test(t.trim())?`<a href="https://sitis-sas.atlassian.net/browse/${t.trim().toUpperCase()}" target="_blank" rel="noopener">${esc(t)} ↗</a>`:esc(t);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qaP=v=>{const q=(v.qa&&v.qa.tasks)||{};let e=0,r=0;Object.entries(v.tasks||{}).forEach(([id,t])=>{const k=q[id],a=k?(+k.est||0):(+t.qaEst||0);e+=a;r+=k?(k.col=='done'?0:a*(1-(k.pct||0)/100)):a});return[e,r1(r)]};
const devR=v=>{let r=0;Object.values(v.tasks||{}).forEach(t=>{r+=fin(t.col)?0:t.est*(1-(t.pct||0)/100)});return r1(r)};
if(!C.databaseURL||C.databaseURL.includes('PEGA')){document.body.innerHTML='<p style="padding:24px">Falta configurar config.js</p>';throw 0}
let code=localStorage.getItem('teamcode');
function askCode(){const c=(prompt('Código del equipo:',code||'')||'').trim();if(/^[A-Za-z0-9_-]{8,}$/.test(c)){localStorage.setItem('teamcode',c);location.reload()}else alert('Código no válido.')}
if(!code){askCode();throw 0}
$('bd').href='burndown.html?c='+code;
const app=initializeApp(C),db=getDatabase(app),R=p=>ref(db,'boards/'+code+'/qa'+(p?'/'+p:''));
const DEF='2026-10-12,2026-11-02,2026-11-16,2026-12-08,2026-12-25';
let S={name:'QA Sprint',start:iso(new Date()),end:iso(new Date(Date.now()+12096e5)),devs:['QA 1','QA 2'],off:DEF,tasks:[],dv:[]},V={},user=null,editId=null;
const AUTH=!!C.apiKey&&!C.apiKey.includes('PEGA'),auth=AUTH?getAuth(app):null,OK=[...(C.DEV_EMAILS||[]),...(C.QA_EMAILS||[])];
const can=()=>!AUTH||(!!user&&(!OK.length||OK.includes(user.email)));
function applyMode(){document.body.classList.toggle('ro',!can());$('lg').style.display=AUTH?'':'none';$('lg').textContent=user?'Cerrar sesión ('+user.email.split('@')[0]+')':'Iniciar sesión';render()}
if(AUTH)onAuthStateChanged(auth,u=>{user=u;applyMode()});else applyMode();
function authBtn(){user?signOut(auth):$('dl').showModal()}
async function doLogin(){try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);$('dl').close();$('pw').value=''}catch(e){alert('Correo o contraseña incorrectos.')}}
async function resetPw(){const e=$('em').value.trim();if(!e){alert('Escribe tu correo en el campo de arriba.');return}try{await sendPasswordResetEmail(auth,e);alert('Te enviamos un correo para restablecer la contraseña.')}catch(x){alert('No se pudo enviar el correo.')}}
onValue(ref(db,'.info/connected'),x=>$('st').textContent=x.val()?'● En línea (cambios en vivo)':'○ Sin conexión');
onValue(ref(db,'boards/'+code),x=>{V=x.val()||{};const q=V.qa||{},m=q.meta;
 if(m)Object.assign(S,{name:m.name,start:m.start,end:m.end,devs:m.devs,off:m.off==null?DEF:m.off});
 S.dv=(V.meta&&V.meta.devs)||[];S.tasks=Object.entries(q.tasks||{}).filter(([,t])=>!t.ret).map(([id,t])=>({...t,id}));render();
 if(can()&&Object.keys(V.tasks||{}).length){const d=iso(new Date()),a=qaP(V)[1],b=r1(a+devR(V));
  if((q.snap||{})[d]!==a)set(R('snap/'+d),a);if((q.tot||{})[d]!==b)set(R('tot/'+d),b)}});
function render(){
 $('t').textContent='QA · '+S.name;$('r').textContent=fmt(S.start)+' al '+fmt(S.end);
 const tot=S.tasks.reduce((s,t)=>s+(+t.est||0),0),rm=S.tasks.reduce((s,t)=>s+(t.col=='done'?0:t.est*(1-(t.pct||0)/100)),0),p=tot?Math.round((tot-rm)/tot*100):0;
 $('pb').style.width=p+'%';$('s').textContent=r1(tot-rm)+' de '+tot+' h de pruebas ('+p+'%)';
 $('b').innerHTML=COLS.map(([c,n])=>{const ts=S.tasks.filter(t=>t.col==c);
  return `<section class="col" data-c="${c}"><h3>${n}<span>${ts.length} tareas · ${ts.reduce((s,t)=>s+(+t.est||0),0)} h</span></h3>`+(ts.map(t=>`<div class="card" draggable="${can()}" data-id="${t.id}" style="--c:${t.dev<0?'var(--mu)':'var(--d'+t.dev+')'}"><b>${jl(t.title)}</b>${t.note?`<div class="nt">${esc(t.note)}</div>`:''}<div class="m"><span>${t.dev<0?'Sin asignar':esc(S.devs[t.dev]||'')} · de ${esc(S.dv[t.devBy]||'—')}</span><span>${t.est?t.est+' h':'<span style="color:var(--d1)">sin horas</span>'}${t.pct&&c!='done'?' · '+t.pct+'%':''}</span></div>${t.pct&&c!='done'?`<div class="pb"><i style="width:${t.pct}%"></i></div>`:''}</div>`).join('')||'<div class="empty">Sin tarjetas</div>')+'</section>'}).join('');
}
const b=$('b');
b.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(c)e.dataTransfer.setData('text',c.dataset.id)});
b.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(c){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));c.classList.add('over')}});
b.addEventListener('drop',e=>{e.preventDefault();const c=e.target.closest('.col');if(c)move(e.dataTransfer.getData('text'),c.dataset.c)});
b.addEventListener('dragend',()=>document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')));
b.addEventListener('click',e=>{if(e.target.closest('a'))return;const c=e.target.closest('.card');if(c&&can())openTask(c.dataset.id)});
function move(id,col){const t=S.tasks.find(t=>t.id==id);if(!can()||!t||t.col==col)return;update(R('tasks/'+id),{col,pct:col=='done'?100:t.col=='done'?0:(t.pct||0)})}
function openTask(id){editId=id;const t=S.tasks.find(t=>t.id==id);if(!t)return;
 $('ti').textContent=t.title;$('es').value=t.est||0;$('pc').value=t.pct||0;$('nt').value=t.note||'';
 $('dv').innerHTML='<option value="-1">Sin asignar</option>'+S.devs.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');$('dv').value=t.dev;
 $('cl').innerHTML=COLS.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');$('cl').value=t.col;$('dt').showModal()}
function saveTask(){const col=$('cl').value;
 update(R('tasks/'+editId),{dev:+$('dv').value,est:+$('es').value||0,col,note:$('nt').value.trim(),pct:col=='done'?100:Math.min(100,Math.max(0,+$('pc').value||0))});$('dt').close()}
function back(){const m=(prompt('Motivo de la devolución a desarrollo:')||'').trim();if(m){update(R('tasks/'+editId),{ret:m});$('dt').close()}}
const meta=()=>({name:S.name,start:S.start,end:S.end,devs:S.devs,off:S.off});
function openCfg(){$('cn').value=S.name;$('cs').value=S.start;$('ce').value=S.end;$('n0').value=S.devs[0];$('n1').value=S.devs[1];$('of').value=(S.off||'').split(',').join('\n');$('dc').showModal()}
function saveCfg(){if(!$('cs').value||!$('ce').value||$('ce').value<$('cs').value){alert('Revisa las fechas.');return}
 S.name=$('cn').value.trim()||'QA Sprint';S.start=$('cs').value;S.end=$('ce').value;S.devs=[0,1].map(i=>$('n'+i).value.trim()||'QA '+(i+1));
 S.off=($('of').value.match(/\d{4}-\d{2}-\d{2}/g)||[]).join(',');$('dc').close();set(R('meta'),meta())}
function closeQA(){if(!can()||!confirm('¿Cerrar el sprint QA? Se guarda el consolidado (y se descarga un .txt) y se limpia el tablero QA.'))return;
 const q=V.qa||{},key=iso(new Date())+'_'+Date.now().toString(36),rec={closedAt:iso(new Date()),dev:{meta:V.meta||null,tasks:V.tasks||null,snap:V.snap||null},qa:{meta:q.meta||null,tasks:q.tasks||null,snap:q.snap||null,tot:q.tot||null}};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rec,null,1)],{type:'text/plain'}));a.download='consolidado-'+key+'.txt';a.click();
 const mm=S.name.match(/^(.*?)(\d+)$/),e=new Date();e.setDate(e.getDate()+13);
 update(R(),{['history/'+key]:rec,tasks:null,snap:null,tot:null,meta:{...meta(),name:mm?mm[1]+(+mm[2]+1):S.name+' (siguiente)',start:iso(new Date()),end:iso(e)}});setTimeout(openCfg,500)}
Object.assign(window,{askCode,authBtn,doLogin,resetPw,openTask,saveTask,back,openCfg,saveCfg,closeQA});
</script></body></html>
