<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Burndown del sprint</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#1b2733;--mu:#65758a;--bd:#d3dae2;--ac:#0f766e;--ok:#15803d;--wa:#b45309;--ko:#be123c;--d0:#2563eb;--d1:#e11d48;--d2:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--card:#1f2c39;--tx:#e8eef4;--mu:#93a4b8;--bd:#2c3b4b;--ac:#2dd4bf;--ok:#4ade80;--wa:#fbbf24;--ko:#fb7185;--d0:#60a5fa;--d1:#fb7185;--d2:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:20px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;margin-bottom:18px}
h1{margin:0;font:700 28px Georgia,serif}.sub{color:var(--mu)}
a.btn{padding:7px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;text-decoration:none}
a.btn:hover{border-color:var(--ac)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k div,.box{background:var(--card);border-radius:10px;padding:12px 14px}
.k small{color:var(--mu);display:block}.k b{font-size:24px}
.box{margin-bottom:16px}
svg{width:100%;height:auto;display:block}
.gr{stroke:var(--bd)}.ax{fill:var(--mu);font-size:12px}
.id{stroke:var(--mu);stroke-dasharray:6 5;fill:none;stroke-width:2}
.ac{stroke:var(--ac);fill:none;stroke-width:3}.dot{fill:var(--ac)}
.hy{stroke:var(--mu);stroke-dasharray:2 3}
.lg{display:flex;gap:18px;color:var(--mu);font-size:13px;margin-top:6px}
.dv{margin:10px 0}.dv .h{display:flex;justify-content:space-between}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
h2{font:700 18px Georgia,serif;margin:0 0 10px}
</style></head><body>
<header><div><h1 id="t">Burndown</h1><div class="sub" id="r"></div><div class="sub" id="live">Conectando…</div></div><div style="display:flex;gap:8px"><a class="btn" href="index.html">Tablero desarrollo</a><a class="btn" href="qa.html">Tablero QA</a></div></header>
<div id="m"></div><div id="secs"></div>
<div class="box"><b>Avance por persona (desarrollo)</b><div id="dv"></div></div>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
const $=id=>document.getElementById(id),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>s.split('-').reverse().slice(0,2).join('/'),r1=v=>Math.round(v*10)/10,fin=c=>c=='done'||c=='approved';
const rm=t=>fin(t.col)?0:t.est*(1-(t.pct||0)/100),sum=a=>a.reduce((s,t)=>s+(+t.est||0),0);
const qaP=v=>{const q=(v.qa&&v.qa.tasks)||{};let e=0,r=0;Object.entries(v.tasks||{}).forEach(([id,t])=>{const k=q[id],a=k?(+k.est||0):(+t.qaEst||0);e+=a;r+=k?(k.col=='done'?0:a*(1-(k.pct||0)/100)):a});return[e,r1(r)]};
const devP=v=>{const T=Object.values(v.tasks||{});return[sum(T),r1(T.reduce((s,t)=>s+rm(t),0))]};
const code=new URLSearchParams(location.search).get('c')||localStorage.getItem('teamcode'),H=new URLSearchParams(location.search).get('h');
if(!window.FB_CONFIG||FB_CONFIG.databaseURL.includes('PEGA')||!code){$('m').innerHTML='<div class="box">Abre esta página desde un botón «Ver burndown» de los tableros.</div>';throw 0}
const db=getDatabase(initializeApp(FB_CONFIG));
onValue(ref(db,'.info/connected'),x=>$('live').textContent=x.val()?'● En vivo':'○ Sin conexión');
onValue(ref(db,'boards/'+code+(H?'/history/'+H:'')),x=>draw(x.val()||{}));
function days(S){const o=S.off||'',a=[],d=new Date(S.start+'T00:00'),e=new Date(S.end+'T00:00');for(;d<=e;d.setDate(d.getDate()+1))if(d.getDay()%6&&!o.includes(iso(d)))a.push(iso(d));return a}
function plot(title,S,tot,cur,snap){
 const ds=days(S),n=ds.length,h=`<section class="box"><h2>${title} <small class="sub">${fmt(S.start)} al ${fmt(S.end)}</small></h2>`;
 if(n<2||!tot)return h+'<div class="sub">Faltan fechas válidas o estimaciones de horas.</div></section>';
 const today=iso(new Date());let ti=-1;ds.forEach((x,i)=>{if(x<=today)ti=i});
 const ks=Object.keys(snap||{}).filter(k=>k>=S.start).sort(),ideal=ds.map((_,i)=>tot*(n-1-i)/(n-1)),act=[];
 for(let i=0;i<=Math.max(ti,0);i++){const x=ds[i];if(ti<0||x==today||(i==n-1&&today>x))act.push(cur);else{const k=ks.filter(k=>k<=x).pop();act.push(k?snap[k]:tot)}}
 const i=Math.max(ti,0),diff=act[act.length-1]-ideal[i],st=diff<=0.001?['En tiempo','ok']:diff/tot<=0.1?['Atención','wa']:['Atrasados','ko'];
 const W=800,H2=330,L=48,R=20,T=14,B=34,X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(1-v/tot)*(H2-T-B),pts=a=>a.map((v,i)=>X(i)+','+Y(v)).join(' ');
 let g='';for(let k=0;k<=4;k++){const q=tot*k/4;g+=`<line class="gr" x1="${L}" x2="${W-R}" y1="${Y(q)}" y2="${Y(q)}"/><text class="ax" x="${L-8}" y="${Y(q)+4}" text-anchor="end">${r1(q)}</text>`}
 const step=Math.ceil(n/10);ds.forEach((x,i)=>{if(i%step==0||i==n-1)g+=`<text class="ax" x="${X(i)}" y="${H2-10}" text-anchor="middle">${fmt(x)}</text>`});
 g+=`<polyline class="id" points="${pts(ideal)}"/>`+(ti>=0?`<line class="hy" x1="${X(ti)}" x2="${X(ti)}" y1="${T}" y2="${H2-B}"/>`:'')+`<polyline class="ac" points="${pts(act)}"/>`+act.map((q,i)=>`<circle class="dot" cx="${X(i)}" cy="${Y(q)}" r="4"><title>${fmt(ds[i])}: ${r1(q)} h pendientes</title></circle>`).join('');
 return h+`<div class="k"><div><small>Estimado</small><b>${r1(tot)} h</b></div><div><small>Avance</small><b>${r1(tot-cur)} h</b></div><div><small>Pendiente</small><b>${r1(cur)} h</b></div><div><small>Días hábiles restantes</small><b>${Math.max(n-1-ti,0)}</b></div><div><small>Estado vs. ideal</small><b style="color:var(--${st[1]})">${st[0]}</b><small>${diff<=0.001?Math.abs(r1(diff))+' h de ventaja':r1(diff)+' h de retraso'}</small></div></div><svg viewBox="0 0 800 330" role="img" aria-label="${title}">${g}</svg><div class="lg"><span>- - - Ritmo ideal</span><span style="color:var(--ac)">━ Horas pendientes reales</span></div></section>`}
function draw(v){
 const S=v.meta;if(!S||!Object.keys(v.tasks||{}).length){$('m').innerHTML='<div class="box">Aún no hay tareas.</div>';$('secs').innerHTML='';$('dv').innerHTML='';return}
 $('m').innerHTML='';$('t').textContent='Burndown · '+S.name;$('r').textContent='Solo días hábiles';
 const T=Object.values(v.tasks),[de,dr]=devP(v),[qe,qr]=qaP(v),q=v.qa||{},qm=q.meta;
 let h=plot('Desarrollo',S,de,dr,v.snap);
 if(!H)h+=qm?plot('QA',qm,qe,qr,q.snap)+plot('Total (desarrollo + QA)',{start:S.start,end:qm.end,off:(S.off||'')+','+(qm.off||'')},de+qe,r1(dr+qr),q.tot):'<section class="box"><div class="sub">QA aún no define su sprint (fechas) en su tablero.</div></section>';
 $('secs').innerHTML=h;
 $('dv').innerHTML=[...S.devs,'Sin asignar'].map((nm,k)=>{const dk=k<S.devs.length?k:-1,ts=T.filter(t=>t.dev==dk),a=sum(ts),b=r1(a-ts.reduce((s,t)=>s+rm(t),0));if(!a&&dk<0)return '';
  return `<div class="dv"><div class="h"><span>${nm.replace(/</g,'&lt;')}</span><span class="sub">${b} de ${a} h</span></div><div class="bar"><i style="width:${a?b/a*100:0}%;background:${dk<0?'var(--mu)':'var(--d'+dk+')'}"></i></div></div>`}).join('');
}
</script></body></html>
