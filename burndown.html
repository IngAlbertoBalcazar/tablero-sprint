<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Burndown del sprint</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#1b2733;--mu:#65758a;--bd:#d3dae2;--ac:#0f766e;--ok:#15803d;--wa:#b45309;--ko:#be123c;--d0:#2563eb;--d1:#e11d48;--d2:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--card:#1f2c39;--tx:#e8eef4;--mu:#93a4b8;--bd:#2c3b4b;--ac:#2dd4bf;--ok:#4ade80;--wa:#fbbf24;--ko:#fb7185;--d0:#60a5fa;--d1:#fb7185;--d2:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:20px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;margin-bottom:18px}
h1{margin:0;font:700 28px Georgia,serif}.sub{color:var(--mu)}
a.btn{padding:7px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;text-decoration:none}
a.btn:hover{border-color:var(--ac)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k div,.box{background:var(--card);border-radius:10px;padding:12px 14px}
.k small{color:var(--mu);display:block}.k b{font-size:24px}
.box{margin-bottom:16px}
svg{width:100%;height:auto;display:block}
.gr{stroke:var(--bd)}.ax{fill:var(--mu);font-size:12px}
.id{stroke:var(--mu);stroke-dasharray:6 5;fill:none;stroke-width:2}
.ac{stroke:var(--ac);fill:none;stroke-width:3}.dot{fill:var(--ac)}
.hy{stroke:var(--mu);stroke-dasharray:2 3}
.lg{display:flex;gap:18px;color:var(--mu);font-size:13px;margin-top:6px}
.dv{margin:10px 0}.dv .h{display:flex;justify-content:space-between}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
</style></head><body>
<header><div><h1 id="t">Burndown</h1><div class="sub" id="r"></div><div class="sub" id="live">Conectando…</div></div><a class="btn" href="kanban.html">Volver al tablero</a></header>
<div id="m"></div>
<div class="k" id="k"></div>
<div class="box"><svg id="c" viewBox="0 0 800 360" role="img" aria-label="Gráfica burndown"></svg>
<div class="lg"><span>- - - Ritmo ideal</span><span style="color:var(--ac)">━ Horas pendientes reales (cuenta al pasar a «Hecho»)</span></div></div>
<div class="box"><b>Avance por persona</b><div id="dv"></div></div>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
const $=id=>document.getElementById(id),sum=a=>a.reduce((s,t)=>s+(+t.est||0),0);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>s.split('-').reverse().slice(0,2).join('/');
const fin=c=>c=='done'||c=='approved',rm=t=>fin(t.col)?0:t.est*(1-(t.pct||0)/100),r1=v=>Math.round(v*10)/10;
const code=new URLSearchParams(location.search).get('c')||localStorage.getItem('teamcode');
if(!window.FB_CONFIG||FB_CONFIG.databaseURL.includes('PEGA')||!code){$('m').innerHTML='<div class="box">Abre esta página desde el botón «Ver burndown» del tablero (ahí se configura el código del equipo).</div>';throw 0}
const db=getDatabase(initializeApp(FB_CONFIG));
onValue(ref(db,'.info/connected'),x=>$('live').textContent=x.val()?'● En vivo':'○ Sin conexión');
onValue(ref(db,'boards/'+code),x=>draw(x.val()||{}));
function draw(v){
 const S=v.meta,T=Object.values(v.tasks||{}),snap=v.snap||{};
 if(!S||!T.length){$('m').innerHTML='<div class="box">Aún no hay tareas. Créalas en el tablero.</div>';$('k').innerHTML='';$('c').innerHTML='';$('dv').innerHTML='';return}
 $('m').innerHTML='';$('t').textContent='Burndown · '+S.name;$('r').textContent=fmt(S.start)+' al '+fmt(S.end)+' (solo días hábiles)';
 const days=[],d=new Date(S.start+'T00:00'),end=new Date(S.end+'T00:00');
 for(;d<=end;d.setDate(d.getDate()+1))if(d.getDay()%6)days.push(iso(d));
 const n=days.length,tot=sum(T);
 if(n<2||!tot){$('m').innerHTML='<div class="box">Necesitas un sprint de al menos 2 días hábiles y tareas con estimación.</div>';return}
 const today=iso(new Date());let ti=-1;days.forEach((x,i)=>{if(x<=today)ti=i});
 const cur=r1(T.reduce((s,t)=>s+rm(t),0)),ks=Object.keys(snap).sort();
 const ideal=days.map((_,i)=>tot*(n-1-i)/(n-1)),act=[];
 for(let i=0;i<=Math.max(ti,0)&&i<n;i++){const x=days[i];
  if(x==today||(i==n-1&&today>x))act.push(cur);
  else{const k=ks.filter(k=>k<=x).pop();act.push(k?snap[k]:tot)}}
 const i=Math.max(ti,0),diff=act[act.length-1]-ideal[i],pct=diff/tot;
 const st=diff<=0.001?['En tiempo','ok']:pct<=0.1?['Atención','wa']:['Atrasados','ko'],left=Math.max(n-1-ti,0);
 $('k').innerHTML=`<div><small>Estimado total</small><b>${tot} h</b></div><div><small>Avance</small><b>${r1(tot-cur)} h</b></div><div><small>Pendiente</small><b>${cur} h</b></div><div><small>Días hábiles restantes</small><b>${left}</b></div><div><small>Estado vs. ideal</small><b style="color:var(--${st[1]})">${st[0]}</b><small>${diff<=0.001?Math.abs(r1(diff))+' h de ventaja':r1(diff)+' h de retraso'}</small></div>`;
 const W=800,H=360,L=48,R=20,Tp=16,B=36,X=i=>L+i*(W-L-R)/(n-1),Y=v=>Tp+(1-v/tot)*(H-Tp-B);
 let g='';
 for(let k=0;k<=4;k++){const q=tot*k/4;g+=`<line class="gr" x1="${L}" x2="${W-R}" y1="${Y(q)}" y2="${Y(q)}"/><text class="ax" x="${L-8}" y="${Y(q)+4}" text-anchor="end">${r1(q)}</text>`}
 const step=Math.ceil(n/10);days.forEach((x,i)=>{if(i%step==0||i==n-1)g+=`<text class="ax" x="${X(i)}" y="${H-12}" text-anchor="middle">${fmt(x)}</text>`});
 const pts=a=>a.map((v,i)=>X(i)+','+Y(v)).join(' ');
 g+=`<polyline class="id" points="${pts(ideal)}"/>`;
 if(ti>=0)g+=`<line class="hy" x1="${X(ti)}" x2="${X(ti)}" y1="${Tp}" y2="${H-B}"/>`;
 g+=`<polyline class="ac" points="${pts(act)}"/>`+act.map((q,i)=>`<circle class="dot" cx="${X(i)}" cy="${Y(q)}" r="4"><title>${fmt(days[i])}: ${q} h pendientes</title></circle>`).join('');
 $('c').innerHTML=g;
 $('dv').innerHTML=[...S.devs,'Sin asignar'].map((nm,k)=>{const dk=k<S.devs.length?k:-1,ts=T.filter(t=>t.dev==dk),a=sum(ts),b=r1(a-ts.reduce((s,t)=>s+rm(t),0));if(!a&&dk<0)return '';
  return `<div class="dv"><div class="h"><span>${nm.replace(/</g,'&lt;')}</span><span class="sub">${b} de ${a} h</span></div><div class="bar"><i style="width:${a?b/a*100:0}%;background:${dk<0?'var(--mu)':'var(--d'+dk+')'}"></i></div></div>`}).join('');
}
</script></body></html>
