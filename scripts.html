<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scripts SQL</title>
<style>
:root{--bg:#eef1f4;--col:#e2e7ec;--card:#fff;--tx:#1b2733;--mu:#65758a;--bd:#d3dae2;--ac:#0f766e;--d0:#2563eb;--d1:#e11d48;--d2:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--col:#18222c;--card:#1f2c39;--tx:#e8eef4;--mu:#93a4b8;--bd:#2c3b4b;--ac:#2dd4bf;--d0:#60a5fa;--d1:#fb7185;--d2:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:20px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font:700 28px Georgia,serif}
.sub{color:var(--mu);margin-top:2px}
.bar{height:8px;background:var(--col);border-radius:4px;overflow:hidden;width:220px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
nav{display:flex;flex-wrap:wrap;gap:8px}
button,a.btn{font:inherit;padding:7px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;cursor:pointer;text-decoration:none}
button:hover,a.btn:hover{border-color:var(--ac)}
.p{background:var(--ac);border-color:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){.p{color:#06201d}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:900px){#b{grid-template-columns:1fr 1fr}}@media(max-width:560px){#b{grid-template-columns:1fr}}
.col{background:var(--col);border-radius:10px;padding:10px;min-height:160px}
.col.over{outline:2px dashed var(--ac)}
h3{margin:2px 4px 10px;display:flex;justify-content:space-between;font-size:15px}
h3 span{color:var(--mu);font-weight:400}
.card{background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--c);cursor:grab;box-shadow:0 1px 2px #0002}
.card:active{cursor:grabbing}
.m{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-top:6px}
.empty{color:var(--mu);text-align:center;padding:16px 4px;font-size:13px}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 3px;color:var(--mu);font-size:13px}
textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);resize:vertical}
.nt{color:var(--mu);font-size:13px;margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.ro .ed{display:none}body.ro .card{cursor:default}
.hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.card b a{color:var(--ac);text-decoration:none}.card b a:hover{text-decoration:underline}
.pb{height:5px;background:var(--col);border-radius:3px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
input,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.r{display:flex;gap:8px;margin-top:16px}.r .sp{flex:1}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bg{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--bd);color:var(--mu)}.bg.u{color:var(--d1);border-color:var(--d1)}
.card b a{color:var(--ac);text-decoration:none}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chips span{background:var(--card);border-radius:8px;padding:3px 10px;font-size:13px}
.li{font-size:13px;color:var(--mu);padding:2px 0}dialog{width:min(560px,94vw)}.k2{background:var(--bg);border-radius:6px;padding:6px 10px;font-size:13px;margin:8px 0}
</style></head><body>
<header>
 <div><h1>Scripts SQL</h1><div class="sub" id="st">Conectando…</div></div>
 <nav>
  <button class="p" onclick="openS()">Nuevo script</button><button onclick="cons()">Descargar consolidado (.sql)</button>
  <a class="btn" href="index.html">Tablero desarrollo</a><a class="btn" href="qa.html">Tablero QA</a><a class="btn" href="mantenimiento.html">Mantenimientos</a>
  <button id="lg" onclick="authBtn()">Iniciar sesión</button>
 </nav>
</header>
<input id="fl" placeholder="Filtrar por ticket (ej. CAD-8242)" style="margin-bottom:12px;max-width:340px">
<div id="m"></div><div id="b"></div>
<dialog id="ds">
 <div class="g"><div><label>Ticket</label><input id="tk"></div><div><label>Tipo</label><select id="tp"><option>Creación</option><option>Alteración</option><option>Inserción</option><option>Otro</option></select></div></div>
 <div class="g"><div><label>Proyecto</label><input id="pj"></div><div><label>Versión</label><input id="vr"></div></div>
 <div class="g"><div><label>Motor BD</label><input id="mo" value="Firebird"></div><div><label>Objeto(s)</label><input id="ob"></div></div>
 <label>SQL (puedes pegar el script completo; el encabezado se genera solo)</label><textarea id="sq" rows="10" style="font-family:monospace;font-size:13px"></textarea>
 <div class="r"><button class="p" onclick="saveS()">Guardar</button><button onclick="ds.close()">Cancelar</button><span class="sp"></span><button id="dx" onclick="delS()">Eliminar</button></div></dialog>
<dialog id="dl"><label>Correo</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password">
 <div class="r"><button class="p" onclick="doLogin()">Entrar</button><button onclick="dl.close()">Cancelar</button><span class="sp"></span><button onclick="resetPw()">Olvidé mi contraseña</button></div></dialog>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue,update,set,remove} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const $=id=>document.getElementById(id),C=window.FB_CONFIG||{};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date());
const fmt=s=>s?s.split('-').reverse().join('/'):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jl=t=>/^[A-Za-z]+-\d+$/.test(t.trim())?`<a href="https://sitis-sas.atlassian.net/browse/${t.trim().toUpperCase()}" target="_blank" rel="noopener">${esc(t)} ↗</a>`:esc(t);
const nm=e=>e.split('@')[0].split('.').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
const code=localStorage.getItem('teamcode'),AUTH=!!C.apiKey&&!C.apiKey.includes('PEGA');
if(!code||!AUTH){document.body.innerHTML='<p style="padding:24px">Esta página necesita el código del equipo (ábrela desde un tablero) y el inicio de sesión configurado.</p>';throw 0}
const app=initializeApp(C),db=getDatabase(app),auth=getAuth(app),P=p=>ref(db,'private/'+code+'/scripts'+(p?'/'+p:''));
const L=k=>(C[k]||[]).map(x=>x.toLowerCase());
let user=null,S={},editId=null,unsub=null;
const role=()=>{const e=user&&user.email.toLowerCase();return!e?'':L('DEV_EMAILS').includes(e)?'dev':L('QA_EMAILS').includes(e)?'qa':''};
const ENV=[['m','Base Maestra'],['d','Desarrollo'],['p','Pruebas'],['x','Producción']];
onAuthStateChanged(auth,u=>{user=u;$('lg').textContent=u?'Cerrar sesión ('+u.email.split('@')[0]+')':'Iniciar sesión';
 if(unsub){unsub();unsub=null}S={};
 if(!role()){$('m').innerHTML='<div class="box">'+(u?'Tu cuenta no tiene acceso a los scripts.':'Inicia sesión (desarrollo o QA) para ver los scripts.')+'</div>';render();return}
 $('m').innerHTML='';$('st').textContent='● En línea';unsub=onValue(P(),x=>{S=x.val()||{};render()},()=>{$('m').innerHTML='<div class="box">Sin permiso para ver los scripts.</div>'})});
function authBtn(){user?signOut(auth):$('dl').showModal()}
async function doLogin(){try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);$('dl').close();$('pw').value=''}catch(e){alert('Correo o contraseña incorrectos.')}}
async function resetPw(){const e=$('em').value.trim();if(!e){alert('Escribe tu correo arriba.');return}try{await sendPasswordResetEmail(auth,e);alert('Te enviamos un correo para restablecer la contraseña.')}catch(x){alert('No se pudo enviar el correo.')}}
const hd=s=>{const l=(a,v)=>'++ '+(a+':').padEnd(37,'-')+'||    '+String(v).padEnd(62)+'++',ap=k=>{const a=s.env&&s.env[k]&&s.env[k].on;return `SI(${a?'X':' '})    NO(${a?' ':'X'})   ||`},E='='.repeat(106)+'++';
 return['/*'+E,l('Fecha de Creación',fmt(s.created)),l('Requerimiento',s.ticket+'.SQL'),l('Proyecto','"'+s.proj+'"'),l('Versión','"'+s.ver+'"'),l('Motor BD','"'+s.motor+'"'),l('Aplicado en Base Maestra',ap('m')),l('Aplicado en Ambiente Desarrollo',ap('d')),l('Aplicado en Ambiente Pruebas',ap('p')),l('Aplicado en Ambiente Producción',ap('x')),l('Nombre Objeto(s)',s.obj),l('Tipo(Creación/Alteración/Inserción)','"'+s.tipo.toUpperCase()+'"'),l('Autor script','"'+s.autor+'"'),E+'*/'].join('\n')};
const full=s=>hd(s)+'\n\n'+s.sql;
const list=()=>{const f=$('fl').value.trim().toLowerCase();return Object.entries(S).map(([id,s])=>({...s,id})).filter(s=>!f||s.ticket.toLowerCase().includes(f)).sort((a,b)=>a.ticket.localeCompare(b.ticket,'es',{numeric:true})||(a.created<b.created?-1:1))};
function render(){const r=role();$('b').innerHTML=r?list().map(s=>`<div class="box" style="background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span><input type="checkbox" class="ck" data-id="${s.id}" style="width:auto"> <b>${jl(s.ticket)}</b> · ${esc(s.obj)} <span class="bg">${esc(s.tipo)}</span></span><span class="sub">${esc(s.autor)} · ${fmt(s.created)} · ${esc(s.proj)} ${esc(s.ver)}</span></div>
 <div class="chips">${ENV.map(([k,n])=>{const e=(s.env||{})[k];return `<button data-t="${s.id}|${k}" style="${e&&e.on?'border-color:var(--ac);color:var(--ac)':''}">${n}: ${e&&e.on?'✔ '+fmt(e.at)+' · '+esc(e.by):'pendiente'}</button>`}).join('')}</div>
 <div class="r"><button class="p" data-c="${s.id}">Copiar</button><button data-e="${s.id}">Editar</button><button data-d="${s.id}">Descargar .sql</button></div></div>`).join('')||'<div class="sub">No hay scripts.</div>':''}
$('fl').value=new URLSearchParams(location.search).get('t')||'';$('fl').addEventListener('input',render);
$('b').addEventListener('click',e=>{const a=e.target.closest('button');if(!a||a.tagName!='BUTTON')return;const d=a.dataset;
 if(d.c)navigator.clipboard.writeText(full(S[d.c])).then(()=>{a.textContent='¡Copiado!';setTimeout(()=>a.textContent='Copiar',1500)},()=>alert('No se pudo copiar.'));
 if(d.e)openS(d.e);if(d.d)dl_(full(S[d.d]),S[d.d].ticket+'.sql');
 if(d.t){const[i,k]=d.t.split('|');if(k=='x'&&role()!='qa'){alert('Solo QA marca Producción.');return}const o=S[i].env&&S[i].env[k]&&S[i].env[k].on;set(P(i+'/env/'+k),{on:!o,at:today(),by:nm(user.email)})}});
function dl_(t,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click()}
function cons(){const k=[...document.querySelectorAll('.ck:checked')].map(c=>c.dataset.id),l=list().filter(s=>!k.length||k.includes(s.id));if(!l.length)return;dl_(l.map(full).join('\n\n'),'consolidado-'+today()+'.sql')}
function openS(id){editId=id||null;const s=S[id]||{tipo:'Alteración',motor:'Firebird',ticket:$('fl').value.trim().toUpperCase()};
 $('tk').value=s.ticket||'';$('tp').value=s.tipo;$('pj').value=s.proj||'';$('vr').value=s.ver||'';$('mo').value=s.motor;$('ob').value=s.obj||'';$('sq').value=s.sql||'';$('dx').style.display=id?'':'none';$('ds').showModal()}
function strip(t){const l=t.split('\n');if(!/^\s*\/\*=/.test(l[0]))return t.trim();for(let j=1;j<l.length;j++)if(/^\s*(\/\*)?=+\+\+\s*(\*\/)?\s*$/.test(l[j]))return l.slice(j+1).join('\n').trim();return t.trim()}
function saveS(){const t=$('tk').value.trim().toUpperCase(),q=strip($('sq').value);if(!t||!q){alert('Ticket y SQL son obligatorios.');return}
 const o=S[editId]||{created:today(),autor:nm(user.email),env:null};
 set(P(editId||'s'+Date.now()),{...o,ticket:t,tipo:$('tp').value,proj:$('pj').value.trim(),ver:$('vr').value.trim(),motor:$('mo').value.trim(),obj:$('ob').value.trim(),sql:q});$('ds').close()}
function delS(){if(confirm('¿Eliminar este script?'))remove(P(editId));$('ds').close()}
Object.assign(window,{authBtn,doLogin,resetPw,openS,saveS,delS,cons});
</script></body></html>
