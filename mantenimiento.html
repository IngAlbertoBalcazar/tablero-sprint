<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mantenimientos</title>
<style>
:root{--bg:#eef1f4;--col:#e2e7ec;--card:#fff;--tx:#1b2733;--mu:#65758a;--bd:#d3dae2;--ac:#0f766e;--d0:#2563eb;--d1:#e11d48;--d2:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--col:#18222c;--card:#1f2c39;--tx:#e8eef4;--mu:#93a4b8;--bd:#2c3b4b;--ac:#2dd4bf;--d0:#60a5fa;--d1:#fb7185;--d2:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:20px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font:700 28px Georgia,serif}
.sub{color:var(--mu);margin-top:2px}
.bar{height:8px;background:var(--col);border-radius:4px;overflow:hidden;width:220px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
nav{display:flex;flex-wrap:wrap;gap:8px}
button,a.btn{font:inherit;padding:7px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;cursor:pointer;text-decoration:none}
button:hover,a.btn:hover{border-color:var(--ac)}
.p{background:var(--ac);border-color:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){.p{color:#06201d}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:900px){#b{grid-template-columns:1fr 1fr}}@media(max-width:560px){#b{grid-template-columns:1fr}}
.col{background:var(--col);border-radius:10px;padding:10px;min-height:160px}
.col.over{outline:2px dashed var(--ac)}
h3{margin:2px 4px 10px;display:flex;justify-content:space-between;font-size:15px}
h3 span{color:var(--mu);font-weight:400}
.card{background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--c);cursor:grab;box-shadow:0 1px 2px #0002}
.card:active{cursor:grabbing}
.m{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-top:6px}
.empty{color:var(--mu);text-align:center;padding:16px 4px;font-size:13px}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 3px;color:var(--mu);font-size:13px}
textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);resize:vertical}
.nt{color:var(--mu);font-size:13px;margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.ro .ed{display:none}body.ro .card{cursor:default}
.hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.card b a{color:var(--ac);text-decoration:none}.card b a:hover{text-decoration:underline}
.pb{height:5px;background:var(--col);border-radius:3px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
input,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.r{display:flex;gap:8px;margin-top:16px}.r .sp{flex:1}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bg{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--bd);color:var(--mu)}.bg.u{color:var(--d1);border-color:var(--d1)}
.card b a{color:var(--ac);text-decoration:none}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chips span{background:var(--card);border-radius:8px;padding:3px 10px;font-size:13px}
.li{font-size:13px;color:var(--mu);padding:2px 0}dialog{width:min(560px,94vw)}.k2{background:var(--bg);border-radius:6px;padding:6px 10px;font-size:13px;margin:8px 0}
</style></head><body>
<header>
 <div><h1>Mantenimientos</h1><div class="sub" id="st">Conectando…</div><div class="chips" id="ch"></div></div>
 <nav>
  <button class="p" id="nb" onclick="dn.showModal()" style="display:none">Nueva solicitud</button>
  <a class="btn" href="index.html">Tablero desarrollo</a><a class="btn" href="qa.html">Tablero QA</a><a class="btn" href="scripts.html">Scripts</a>
  <button onclick="askCode()">Código del equipo</button><button id="lg" onclick="authBtn()">Iniciar sesión</button>
 </nav>
</header>
<main id="b"></main>
<dialog id="dt"></dialog>
<dialog id="dn"><label>Ticket de Jira (ej. CAD-8468)</label><input id="tk">
 <label>Descripción</label><textarea id="ds" rows="3"></textarea>
 <div class="g"><div><label>Prioridad</label><select id="p2"><option>Urgente</option><option>Alta</option><option selected>Normal</option><option>Baja</option></select></div>
 <div><label>Tipo</label><select id="tp"><option>Error</option><option>Ajuste</option><option>Consulta</option></select></div></div>
 <label>Módulo</label><input id="md">
 <div class="r"><button class="p" onclick="newReq()">Crear</button><button onclick="dn.close()">Cancelar</button></div></dialog>
<dialog id="dl"><label>Correo</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password">
 <div class="r"><button class="p" onclick="doLogin()">Entrar</button><button onclick="dl.close()">Cancelar</button><span class="sp"></span><button onclick="resetPw()">Olvidé mi contraseña</button></div></dialog>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,onValue,update,set,remove} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const COLS=[['todo','Por atender'],['doing','En progreso'],['qa','En QA'],['closed','Cerrado']],CN=Object.fromEntries(COLS),$=id=>document.getElementById(id),C=window.FB_CONFIG||{};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date());
const fmt=s=>s?s.split('-').reverse().join('/'):'',r1=v=>Math.round(v*10)/10;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jl=t=>/^[A-Za-z]+-\d+$/.test(t.trim())?`<a href="https://sitis-sas.atlassian.net/browse/${t.trim().toUpperCase()}" target="_blank" rel="noopener">${esc(t)} ↗</a>`:esc(t);
const nm=e=>e.split('@')[0].split('.').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
if(!C.databaseURL||C.databaseURL.includes('PEGA')){document.body.innerHTML='<p style="padding:24px">Falta configurar config.js</p>';throw 0}
let code=localStorage.getItem('teamcode');
function askCode(){const c=(prompt('Código del equipo:',code||'')||'').trim();if(/^[A-Za-z0-9_-]{8,}$/.test(c)){localStorage.setItem('teamcode',c);location.reload()}else alert('Código no válido.')}
if(!code){askCode();throw 0}
const app=initializeApp(C),db=getDatabase(app),R=p=>ref(db,'boards/'+code+'/mant'+(p?'/'+p:''));
const AUTH=!!C.apiKey&&!C.apiKey.includes('PEGA'),auth=AUTH?getAuth(app):null,L=k=>(C[k]||[]).map(x=>x.toLowerCase());
let user=null,V={},T=[];
const role=()=>{if(!AUTH)return'dev';const e=user&&user.email.toLowerCase();return!e?'':L('DEV_EMAILS').includes(e)?'dev':L('QA_EMAILS').includes(e)?'qa':L('PROD_EMAILS').includes(e)?'prod':''};
const off=()=>(V.meta&&V.meta.off)||'',who=()=>user?nm(user.email):'Equipo',dn_=()=>(V.meta&&V.meta.devs)||[];
function applyMode(){$('lg').style.display=AUTH?'':'none';$('lg').textContent=user?'Cerrar sesión ('+user.email.split('@')[0]+')':'Iniciar sesión';const r=role();$('nb').style.display=r=='dev'||r=='prod'?'':'none';render()}
if(AUTH)onAuthStateChanged(auth,u=>{user=u;applyMode()});else applyMode();
function authBtn(){user?signOut(auth):$('dl').showModal()}
async function doLogin(){try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);$('dl').close();$('pw').value=''}catch(e){alert('Correo o contraseña incorrectos.')}}
async function resetPw(){const e=$('em').value.trim();if(!e){alert('Escribe tu correo arriba.');return}try{await sendPasswordResetEmail(auth,e);alert('Te enviamos un correo para restablecer la contraseña.')}catch(x){alert('No se pudo enviar el correo.')}}
const bd=(a,b)=>{if(!a||!b||b<=a)return 0;let n=0;const d=new Date(a+'T00:00'),e=new Date(b+'T00:00');for(d.setDate(d.getDate()+1);d<=e;d.setDate(d.getDate()+1))if(d.getDay()%6&&!off().includes(iso(d)))n++;return n};
const ec=t=>t.col=='qa'&&t.v?(t.v.v=='close'?'closed':'doing'):t.col;
const tm=t=>{const sg=t.col=='closed'?0:bd(t.since,t.v?t.v.at:today()),w=(t.a_todo||0)+(t.col=='todo'?sg:0),d=(t.a_doing||0)+(t.col=='doing'?sg:0),q=(t.a_qa||0)+(t.col=='qa'?sg:0);return{w,d,q,t:w+d+q}};
const trans=(t,c,d)=>({col:c,since:d,...(t.col!='closed'?{['a_'+t.col]:(t['a_'+t.col]||0)+bd(t.since,d)}:{})});
onValue(ref(db,'.info/connected'),x=>$('st').textContent=x.val()?'● En línea (cambios en vivo)':'○ Sin conexión');
onValue(ref(db,'boards/'+code),x=>{V=x.val()||{};const M=V.mant||{},q=M.qa||{};
 T=Object.entries(M.tasks||{}).map(([id,t])=>({...t,id,v:q[id]}));render();
 if(role()=='dev')T.forEach(t=>{if(!t.v)return;const v=t.v;
  if(t.col=='qa'){if(v.v=='close')update(R('tasks/'+t.id),{...trans(t,'closed',v.at),closedAt:v.at});
   else update(R('tasks/'+t.id),{...trans(t,'doing',v.at),ret:(t.ret||0)+1,['rl/'+Date.now()]:{date:v.at,motivo:v.motivo||'',by:v.by||''}})}
  remove(R('qa/'+t.id))})});
function render(){
 const r=role(),mes=today().slice(0,7),cl=T.filter(t=>ec(t)=='closed'),ab=T.filter(t=>ec(t)!='closed');
 const avg=cl.length?r1(cl.reduce((s,t)=>s+tm(t).t,0)/cl.length):0,dv=T.filter(t=>t.ret).length,hrs=T.reduce((s,t)=>s+Object.values(t.log||{}).reduce((a,x)=>a+(+x.h||0),0),0);
 $('ch').innerHTML=`<span>Abiertos: <b>${ab.length}</b></span><span>En QA: <b>${T.filter(t=>ec(t)=='qa').length}</b></span><span>Cerrados en ${mes.split('-').reverse().join('/')}: <b>${cl.filter(t=>(t.closedAt||(t.v&&t.v.at)||'').startsWith(mes)).length}</b></span><span>Prom. solución: <b>${avg} d háb.</b></span><span>Devueltos: <b>${dv}</b>${T.length?' ('+Math.round(dv/T.length*100)+'%)':''}</span><span>Horas en bitácora: <b>${r1(hrs)}</b></span>`;
 $('b').innerHTML=COLS.map(([c,n])=>{const ts=T.filter(t=>ec(t)==c);
  return `<section class="col" data-c="${c}"><h3>${n}<span>${ts.length}</span></h3>`+(ts.map(t=>{const dv=t.dev>=0?dn_()[t.dev]:'';return `<div class="card" draggable="${r=='dev'&&c!='closed'}" data-id="${t.id}" style="--c:${t.dev>=0?'var(--d'+t.dev+')':'var(--mu)'}"><b>${jl(t.title)}</b> <span class="bg ${t.prio=='Urgente'?'u':''}">${esc(t.prio)}</span>${t.ret?` <span class="bg u">↩ ${t.ret}</span>`:''}<div class="nt">${esc(t.desc)}</div><div class="m"><span>${esc(dv||'Sin asignar')} · ${esc(t.tipo)}</span><span>${tm(t).t} d</span></div></div>`}).join('')||'<div class="empty">Sin tarjetas</div>')+'</section>'}).join('');
}
const b=$('b');
b.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(c)e.dataTransfer.setData('text',c.dataset.id)});
b.addEventListener('dragover',e=>{if(e.target.closest('.col'))e.preventDefault()});
b.addEventListener('drop',e=>{e.preventDefault();const c=e.target.closest('.col'),t=T.find(t=>t.id==e.dataTransfer.getData('text'));if(!c||!t||role()!='dev')return;const n=c.dataset.c;if(n=='closed'||n==t.col)return;update(R('tasks/'+t.id),trans(t,n,today()))});
b.addEventListener('click',e=>{if(e.target.closest('a'))return;const c=e.target.closest('.card');if(c)openCard(c.dataset.id)});
function openCard(id){const t=T.find(t=>t.id==id),r=role(),E=ec(t),k=tm(t),dev=r=='dev',lg=Object.values(t.log||{}).sort((a,b)=>a.date<b.date?-1:1),rl=Object.values(t.rl||{}).sort((a,b)=>a.date<b.date?-1:1),h=lg.reduce((s,x)=>s+(+x.h||0),0);
 const op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
 $('dt').innerHTML=`<b>${jl(t.title)}</b> <span class="sub">${CN[E]} · reportó ${esc(t.rep||'')} · ${fmt(t.created)}</span><p>${esc(t.desc)}</p><div class="sub">${esc(t.prio)} · ${esc(t.tipo)} · ${esc(t.mod||'')}</div>
 <div class="k2">Espera ${k.w} d · Desarrollo ${k.d} d · QA ${k.q} d · <b>Total ${k.t} d</b> (hábiles) · Bitácora ${r1(h)} h</div>
 ${dev?`<div class="g"><div><label>Responsable</label><select id="rv"><option value="-1">Sin asignar</option>${dn_().map((n,i)=>`<option value="${i}" ${t.dev==i?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div><label>Prioridad</label><select id="pr">${op(['Urgente','Alta','Normal','Baja'],t.prio)}</select></div></div><label>Notas</label><textarea id="nt" rows="2">${esc(t.note||'')}</textarea>`:t.note?`<label>Notas</label><p>${esc(t.note)}</p>`:''}
 <label>Devoluciones (${t.ret||0})</label>${rl.map(x=>`<div class="li">↩ ${fmt(x.date)} · ${esc(x.motivo)}</div>`).join('')||'<div class="li">Ninguna</div>'}
 <label>Bitácora</label>${lg.map(x=>`<div class="li">${fmt(x.date)} · ${esc(x.who)} · ${x.h||0} h — ${esc(x.txt)}</div>`).join('')||'<div class="li">Sin entradas</div>'}
 ${dev?`<div class="g" style="margin-top:6px"><input id="lt" placeholder="¿Qué se hizo?"><input id="lh" type="number" step="0.5" min="0" placeholder="Horas"></div><button style="margin-top:6px" onclick="addLog('${id}')">Agregar a bitácora</button>`:''}
 <div class="r">${dev?`<button class="p" onclick="saveCard('${id}')">Guardar</button>`:''}${r=='qa'&&E=='qa'?`<button class="p" onclick="verdict('${id}','close')">Cerrar</button><button onclick="verdict('${id}','ret')">Devolver a progreso</button>`:''}<button onclick="dt.close()">Salir</button><span class="sp"></span>${dev||r=='qa'?`<a class="btn" href="scripts.html?t=${encodeURIComponent(t.title)}">Scripts</a>`:''}</div>`;$('dt').showModal()}
function saveCard(id){update(R('tasks/'+id),{dev:+$('rv').value,prio:$('pr').value,note:$('nt').value.trim()});$('dt').close()}
function addLog(id){const x=$('lt').value.trim();if(!x)return;set(R('tasks/'+id+'/log/'+Date.now()),{date:today(),who:who(),txt:x,h:+$('lh').value||0});$('dt').close()}
function verdict(id,v){let m='';if(v=='ret'){m=(prompt('Motivo de la devolución:')||'').trim();if(!m)return}set(R('qa/'+id),{v,motivo:m,at:today(),by:who()});$('dt').close()}
function newReq(){const t=$('tk').value.trim(),d=$('ds').value.trim();if(!t||!d){alert('Ticket y descripción son obligatorios.');return}
 set(R('tasks/t'+Date.now()),{title:t,desc:d,prio:$('p2').value,tipo:$('tp').value,mod:$('md').value.trim(),rep:who(),created:today(),col:'todo',since:today(),ret:0,dev:-1});$('dn').close();['tk','ds','md'].forEach(i=>$(i).value='')}
Object.assign(window,{askCode,authBtn,doLogin,resetPw,saveCard,addLog,verdict,newReq});
</script></body></html>
